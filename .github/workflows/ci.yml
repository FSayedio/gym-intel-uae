name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kubernetes:
    name: Kubernetes acceptance (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false
      - name: Install checksum-verified project-local kubectl
        shell: bash
        run: |
          mkdir -p .local/kubernetes/bin
          curl --fail --location --silent --show-error https://dl.k8s.io/release/v1.36.4/bin/linux/arm64/kubectl -o .local/kubernetes/bin/kubectl
          curl --fail --location --silent --show-error https://dl.k8s.io/release/v1.36.4/bin/linux/arm64/kubectl.sha256 -o .local/kubernetes/bin/kubectl.sha256
          printf '%s  %s\n' "$(cat .local/kubernetes/bin/kubectl.sha256)" .local/kubernetes/bin/kubectl | sha256sum --check
          chmod 700 .local/kubernetes/bin/kubectl
          echo "$GITHUB_WORKSPACE/.local/kubernetes/bin" >> "$GITHUB_PATH"
      - name: Create isolated local cluster and verify full update lifecycle
        run: |
          sh scripts/k8s.sh bootstrap
          sh scripts/verify-kubernetes.sh
      - name: Cluster diagnostics on failure (no Secrets or CSV arguments)
        if: failure()
        run: |
          kubectl --kubeconfig .local/kubernetes/kubeconfig --context kind-gym-intel get nodes,pods --all-namespaces || true
          kubectl --kubeconfig .local/kubernetes/kubeconfig --context kind-gym-intel get events --all-namespaces --sort-by=.lastTimestamp || true

  quality:
    name: CI checks (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CI_IMAGE: gym-intel-ci:${{ github.sha }}
      RELEASE_IMAGE: gym-intel-runtime:${{ github.sha }}
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: gym_intel
          POSTGRES_DB: postgres
          # Disposable CI database only; never a local/production credential.
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U gym_intel -d postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false

      - name: Record tested revision
        run: |
          git show --no-patch --format='Tested commit: %H%nParents: %P'

      - name: Validate local Compose configuration
        run: docker compose config --quiet

      - name: Build separate checks and runtime images
        run: |
          docker build --target checks --tag "$CI_IMAGE" .
          docker build --target runtime --tag "$RELEASE_IMAGE" .

      - name: Verify advisory audit rejects an unavailable registry
        shell: bash
        run: |
          set +e
          audit_output="$(docker run --rm --network none --memory 512m --cpus 1 \
            --env HEX_HTTP_TIMEOUT=1 --env HEX_HTTP_CONCURRENCY=8 \
            "$CI_IMAGE" mix hex.audit 2>&1)"
          audit_status=$?
          set -e
          printf '%s\n' "$audit_output"
          test "$audit_status" -ne 0
          [[ "$audit_output" == *'Could not audit these locked packages:'* ]]
          [[ "$audit_output" != *'No retired or security advisory packages found'* ]]
          echo 'PASS: unavailable registry fails the audit instead of accepting cached results'

      - name: Verify Compose defaults and alternate host ports
        run: CHECK_IMAGE="$CI_IMAGE" sh scripts/verify-compose.sh

      - name: Audit dependencies, check formatting, compilation, migrations and tests
        shell: bash
        run: |
          umask 077
          password_file="$RUNNER_TEMP/gym-intel-ci-database-password"
          printf '%s' 'ci-only-password' > "$password_file"
          docker run --rm --network host \
            --env MIX_ENV=test \
            --env RUN_DB_TESTS=true \
            --env DATABASE_NAME=gym_intel_test \
            --env DATABASE_HOST=127.0.0.1 \
            --env DATABASE_PORT=5432 \
            --env DATABASE_USER=gym_intel \
            --env DATABASE_PASSWORD_FILE=/run/secrets/ci_database_password \
            --volume "$password_file:/run/secrets/ci_database_password:ro" \
            --volume "$GITHUB_WORKSPACE/.formatter.exs:/app/.formatter.exs:ro" \
            --volume "$GITHUB_WORKSPACE/scripts:/app/scripts:ro" \
            --volume "$GITHUB_WORKSPACE/test:/app/test:ro" \
            --volume "$GITHUB_WORKSPACE/data:/app/data:ro" \
            --volume "$GITHUB_WORKSPACE/grafana:/app/grafana:ro" \
            "$CI_IMAGE" sh scripts/ci-checks.sh

      - name: Verify final non-root runtime with isolated live jobs
        env:
          RELEASE_TEST_NETWORK: host
          RELEASE_TEST_HOST: 127.0.0.1
        run: |
          export RELEASE_TEST_OWNER_PASSWORD_FILE="$RUNNER_TEMP/gym-intel-ci-database-password"
          sh scripts/verify-release.sh

      - name: Verify backup recovery, rolling-two updates and saved status with synthetic data
        run: |
          docker pull --platform linux/arm64 grafana/grafana:13.2
          CHECK_IMAGE="$CI_IMAGE" sh scripts/verify-recovery.sh

      - name: Reproduce fresh setup, measure workload and recover an interrupted import
        run: CHECK_IMAGE="$CI_IMAGE" sh scripts/verify-readiness.sh
