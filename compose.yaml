name: gym-intel-uae

services:
  postgres:
    image: postgres:18.6-alpine
    platform: linux/arm64
    environment:
      POSTGRES_DB: gym_intel_dev
      POSTGRES_USER: gym_intel
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command: ["postgres", "-c", "hba_file=/opt/gym-intel/pg_hba.conf"]
    secrets:
      - postgres_password
      - grafana_database_password
      - postgres_app_password
      - postgres_migrator_password
    healthcheck:
      test: ["CMD-SHELL", "sh /opt/gym-intel/psql.sh --host=127.0.0.1 --tuples-only --no-align --command='SELECT 1' > /dev/null"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres:/opt/gym-intel:ro
      - ./priv:/opt/gym-intel-priv:ro

  app:
    image: gym-intel-runtime:local
    pull_policy: never
    build:
      context: .
      target: runtime
    platform: linux/arm64
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    environment:
      DATABASE_NAME: gym_intel_dev
      DATABASE_USER: gym_intel_app
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_POOL_SIZE: "5"
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
      SOURCE_CHECKS_ENABLED: "true"
    secrets:
      - postgres_app_password
    volumes:
      - ./data:/app/data:ro

  grafana:
    image: grafana/grafana:13.2
    platform: linux/arm64
    entrypoint: ["/bin/sh", "/opt/gym-intel/grafana-start.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
      - grafana_database_password
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/start.sh:/opt/gym-intel/grafana-start.sh:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/project-dashboards:ro

volumes:
  postgres_data:
  grafana_data:

secrets:
  grafana_admin_password:
    file: ./.secrets/grafana_admin_password
  postgres_password:
    file: ./.secrets/postgres_password
  grafana_database_password:
    file: ./.secrets/grafana_database_password
  postgres_app_password:
    file: ./.secrets/postgres_app_password
  postgres_migrator_password:
    file: ./.secrets/postgres_migrator_password
