name: gym-intel-uae

services:
  postgres:
    image: postgres:18.6-alpine
    platform: linux/arm64
    environment:
      POSTGRES_DB: gym_intel_dev
      POSTGRES_USER: gym_intel
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_intel -d gym_intel_dev"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build:
      context: .
    platform: linux/arm64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"

  grafana:
    image: grafana/grafana:13.2
    platform: linux/arm64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:
