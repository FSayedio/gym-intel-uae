# Ephemeral synthetic integration fixture, never the three-service development stack.
services:
  postgres:
    image: postgres:18.6-alpine
    platform: linux/arm64
    environment:
      POSTGRES_USER: gym_intel
      POSTGRES_DB: gym_intel_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    command: ["postgres", "-c", "hba_file=/opt/gym-intel/pg_hba.conf"]
    labels:
      com.gym-intel.recovery.fixture: ${RECOVERY_FIXTURE_PROJECT:?}
    tmpfs:
      - /var/lib/postgresql:rw,nosuid,noexec,size=512m
    volumes:
      - ../../postgres:/opt/gym-intel:ro
      - ../../priv:/opt/gym-intel-priv:ro
    secrets:
      - postgres_password
      - postgres_app_password
      - postgres_migrator_password
      - grafana_database_password
    healthcheck:
      test: ["CMD-SHELL", "sh /opt/gym-intel/psql.sh --host=127.0.0.1 -qAtc 'SELECT 1' > /dev/null"]
      interval: 1s
      timeout: 3s
      retries: 30
  app:
    image: ${RELEASE_IMAGE:-gym-intel-runtime:local}
    pull_policy: never
    platform: linux/arm64
    stop_grace_period: 20s
    environment:
      DATABASE_NAME: gym_intel_dev
      DATABASE_USER: gym_intel_app
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets:
      - postgres_app_password
    depends_on:
      postgres:
        condition: service_healthy
secrets:
  postgres_password:
    file: ${RECOVERY_FIXTURE_PASSWORD_FILE:?}
  postgres_app_password:
    file: ${RECOVERY_FIXTURE_PASSWORD_FILE:?}
  postgres_migrator_password:
    file: ${RECOVERY_FIXTURE_PASSWORD_FILE:?}
  grafana_database_password:
    file: ${RECOVERY_FIXTURE_PASSWORD_FILE:?}
